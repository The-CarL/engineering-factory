name: Factory checks

on:
  pull_request:
  push:
    branches: [main]

# Untrusted PR code receives no cloud/admin secrets or persistent Git credentials.
permissions:
  contents: read

jobs:
  validate:
    name: Validate factory repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full reachable history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install hash-verified validation tools
        shell: bash
        run: ./scripts/install-check-tools.sh

      - name: Lint, policy, isolated tests, and content-aware secret scans
        shell: bash
        run: make check
