name: Factory checks

on:
  pull_request:
  push:
    branches: [main]

# Untrusted pull requests must never receive elevated GitHub or cloud credentials.
permissions:
  contents: read

jobs:
  validate:
    name: Validate factory repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify required baseline files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .github/CODEOWNERS
          test -f .gitignore

      - name: Reject tracked credential artifacts
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(git ls-files | grep -E '(^|/)(\.env($|\.[^/]+$)|id_rsa$|id_ed25519$|\.aws/|\.terraform/)|\.tfstate($|\.)|\.tfvars$' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [[ -n "$bad_files" ]]; then
            echo "Blocked sensitive file names in tracked files:"
            printf '%s\n' "$bad_files"
            exit 1
          fi

      - name: Syntax-check shell scripts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d scripts ]]; then
            while IFS= read -r -d '' path; do
              bash -n "$path"
            done < <(find scripts -type f -name '*.sh' -print0)
          fi
